name: Retail learning-path and progress-management QA

on:
  push:
    branches:
      - feature/lex-practice-learning-path-integration
      - integration/retail-secure-submissions
    paths:
      - "lexacademicenglish_multipage/students/retail/learning-path/index.html"
      - "lexacademicenglish_multipage/students/retail/index.html"
      - "functions/students/retail/submit.js"
      - "scripts/verify-retail-learning-path.mjs"
      - "scripts/test-retail-submit.mjs"
      - "functions/api/teacher-data.js"
      - "lexacademicenglish_multipage/functions/api/teacher-data.js"
      - "scripts/test-teacher-data-auth.mjs"
      - "functions/api/teacher-data.js"
      - "lexacademicenglish_multipage/functions/api/teacher-data.js"
      - "lexacademicenglish_multipage/teacher/index.html"
      - "scripts/test-teacher-progress.mjs"
      - "scripts/test-teacher-dashboard.mjs"
      - "functions/students/api/progress.js"
      - "migrations/0001_fex_learner_progress.sql"
      - "lexacademicenglish_multipage/students/progress/index.html"
      - "lexacademicenglish_multipage/students/retail/learning-path/index.html"
      - "scripts/test-student-progress.mjs"
      - "functions/students/api/submissions.js"
      - "lexacademicenglish_multipage/functions/students/api/submissions.js"
      - "migrations/0002_fex_student_submissions.sql"
      - "scripts/test-student-submissions.mjs"
      - "lexacademicenglish_multipage/students/writing/index.html"
      - "lexacademicenglish_multipage/students/ielts/index.html"
      - "lexacademicenglish_multipage/students/ielts/assets/ielts-engine.js"
      - ".github/workflows/retail-learning-path-qa.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "lexacademicenglish_multipage/students/retail/learning-path/index.html"
      - "lexacademicenglish_multipage/students/retail/index.html"
      - "functions/students/retail/submit.js"
      - "scripts/verify-retail-learning-path.mjs"
      - "scripts/test-retail-submit.mjs"
      - "functions/api/teacher-data.js"
      - "lexacademicenglish_multipage/functions/api/teacher-data.js"
      - "scripts/test-teacher-data-auth.mjs"
      - "functions/api/teacher-data.js"
      - "lexacademicenglish_multipage/functions/api/teacher-data.js"
      - "lexacademicenglish_multipage/teacher/index.html"
      - "scripts/test-teacher-progress.mjs"
      - "scripts/test-teacher-dashboard.mjs"
      - "functions/students/api/progress.js"
      - "migrations/0001_fex_learner_progress.sql"
      - "lexacademicenglish_multipage/students/progress/index.html"
      - "lexacademicenglish_multipage/students/retail/learning-path/index.html"
      - "scripts/test-student-progress.mjs"
      - ".github/workflows/retail-learning-path-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify learning-path content and safeguards
        run: node scripts/verify-retail-learning-path.mjs
      - name: Test Access-verified Retail submission endpoint
        run: node --test scripts/test-retail-submit.mjs
      - name: Test teacher data API authorisation
        run: node --test scripts/test-teacher-data-auth.mjs
      - name: Test teacher dashboard rendering safeguards
        run: node --test scripts/test-teacher-dashboard.mjs
      - name: Test private student progress and review records
        run: node --test scripts/test-student-progress.mjs
      - name: Test teacher progress and feedback management
        run: node --test scripts/test-teacher-progress.mjs
      - name: Test direct student submission storage
        run: node --test scripts/test-student-submissions.mjs
