<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni Outcomes & International Placements | Fex Studio</title>
  <meta name="description" content="Explore where Fex Studio alumni have progressed to universities and international careers across Italy, the UK, the USA, Germany, Lithuania, Australia, Belgium, Ireland, and the Netherlands." />

  <!-- Leaflet Core (Zero API Key, Reliable Tile Rendering) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root {
      --bg-paper: #faf9f6;
      --bg-card: #ffffff;
      --ink-primary: #09090b;
      --ink-body: #3f3f46;
      --ink-muted: #52525b;
      --border-subtle: #e4e4e7;
      --border-strong: #18181b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg-paper);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Editorial Top Navigation */
    .fex-nav {
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-paper);
      padding: 1.25rem 1.5rem;
    }
    .fex-nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .fex-brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      text-decoration: none;
      color: var(--ink-primary);
      letter-spacing: 0.04em;
    }
    .fex-nav-links {
      display: flex;
      gap: 1.5rem;
      font-size: 0.88rem;
    }
    .fex-nav-links a {
      text-decoration: none;
      color: var(--ink-body);
    }
    .fex-nav-links a:hover, .fex-nav-links a.active {
      color: var(--ink-primary);
      font-weight: 600;
    }

    /* Main Container */
    .fex-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 5rem 1.5rem;
    }

    /* Page Header */
    .fex-eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.65rem;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 400;
      line-height: 1.15;
      margin: 0 0 1rem 0;
    }
    .fex-lead {
      font-size: 1.05rem;
      color: var(--ink-body);
      max-width: 700px;
      margin: 0 0 2.5rem 0;
    }

    /* Macro Summary Strip */
    .fex-summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 3rem;
    }
    .fex-stat-num {
      display: block;
      font-family: Georgia, serif;
      font-size: 1.9rem;
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }
    .fex-stat-label {
      font-size: 0.84rem;
      color: var(--ink-muted);
    }

    /* Filter Bar */
    .fex-filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .fex-filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .fex-filter-btn {
      background: var(--bg-card);
      border: 1px solid #d4d4d8;
      padding: 0.45rem 0.9rem;
      font-size: 0.82rem;
      cursor: pointer;
      color: var(--ink-primary);
      transition: all 0.15s ease;
    }
    .fex-filter-btn.active, .fex-filter-btn:hover {
      background: var(--border-strong);
      color: #ffffff;
      border-color: var(--border-strong);
    }
    .fex-zoom-hint {
      font-size: 0.8rem;
      color: var(--ink-muted);
    }

    /* Map & Drawer Grid */
    .fex-map-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin-bottom: 3.5rem;
    }
    @media (max-width: 820px) {
      .fex-map-layout { grid-template-columns: 1fr; }
    }

    #fex-placement-map {
      height: 470px;
      width: 100%;
      border: 1px solid #d4d4d8;
      background: #e4e4e7;
      z-index: 1;
    }

    /* Editorial Monochrome Filter for OpenStreetMap Tiles */
    .leaflet-tile-pane {
      filter: grayscale(100%) contrast(92%) brightness(103%);
    }

    .fex-detail-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .fex-detail-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }
    .fex-detail-panel h2 {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
      margin: 0.75rem 0;
    }
    .fex-detail-badge {
      display: inline-block;
      background: var(--border-strong);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      padding: 0.35rem 0.75rem;
      margin-bottom: 1rem;
    }
    .fex-detail-panel p {
      font-size: 0.9rem;
      color: var(--ink-body);
      flex-grow: 1;
      margin: 0 0 1.25rem 0;
    }
    .fex-detail-footer {
      font-size: 0.78rem;
      font-weight: 600;
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.85rem;
    }

    /* Alumni Cohort Ledger */
    .fex-ledger-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 2rem;
      margin-bottom: 3.5rem;
    }
    .fex-ledger-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #f4f4f5;
    }
    .fex-ledger-header h2 {
      font-family: Georgia, serif;
      font-size: 1.35rem;
      font-weight: 400;
      margin: 0;
    }
    .fex-ledger-header span {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-muted);
    }
    .fex-roll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 0.85rem 1.75rem;
    }
    .fex-roll-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid #f4f4f5;
      font-size: 0.9rem;
    }
    .fex-roll-item strong { font-weight: 600; }
    .fex-roll-item span { font-size: 0.8rem; color: var(--ink-muted); }

    /* Bottom Conversion Callout */
    .fex-cta-box {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      padding: 2.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }
    .fex-cta-box h3 {
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-weight: 400;
      margin: 0 0 0.35rem 0;
    }
    .fex-cta-box p {
      margin: 0;
      font-size: 0.92rem;
      color: var(--ink-body);
    }
    .fex-cta-btn {
      display: inline-block;
      background: var(--border-strong);
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.4rem;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .fex-cta-btn:hover { opacity: 0.9; }

    .fex-pin {

      border: 2.5px solid #ffffff;
      border-radius: 50%;
